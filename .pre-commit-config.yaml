# Hooks locais. Instalação: pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: local
    hooks:
      - id: zero-leak
        name: Auditoria Zero-Leak (scripts/verificar_segredos.py --staged)
        entry: python scripts/verificar_segredos.py --staged
        language: python
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
